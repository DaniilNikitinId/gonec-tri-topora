name: CI Дозорного Гонца
on:
  push:
    branches: ["**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: pip install -r requirements.txt
    - name: Run tests
      run: pytest -v
    - name: Create report
      run: echo "Проверка пройдена" > report.txt
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: gonec-report
        path: report.txt

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - run: echo "🏰 Донесение доставлено до царской заставы (main)"
